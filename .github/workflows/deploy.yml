name: Deploy — GCP Cloud Run + Supabase

# Deploys the Docker image to Google Cloud Run and deploys Supabase Edge Functions.
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID            — Google Cloud project ID
#   GCP_SA_KEY                — GCP service account JSON key (with Cloud Run + GCR roles)
#   VITE_SUPABASE_URL         — Supabase project URL (baked into the static bundle at build time)
#   VITE_SUPABASE_ANON_KEY    — Supabase anon key
#   SUPABASE_ACCESS_TOKEN     — Supabase CLI access token
#   SUPABASE_PROJECT_ID       — Supabase project ref
#
# Cloudflare DNS (one-time manual step — no secrets needed here):
#   Option A — Cloud Run custom domain mapping (recommended):
#     Run once:  gcloud run domain-mappings create \
#                  --service ict-cloud-portal \
#                  --domain ict-cloud.solutions \
#                  --region europe-west2
#     Then in Cloudflare DNS add the CNAME/A records that gcloud prints out.
#     Set Cloudflare proxy: Proxied (orange cloud). SSL/TLS → "Full".
#
#   Option B — Cloudflare Worker proxy (no Cloud Run domain mapping needed):
#     Add a CNAME in Cloudflare: @ → <hash>-<region>.a.run.app  (Proxied)
#     Cloud Run will reject requests with a Host header mismatch; use a
#     Cloudflare Transform Rule to rewrite the Host header to the run.app URL,
#     or use Option A instead.

on:
  push:
    branches: [main]

env:
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ict-cloud-portal

jobs:
  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for Supabase CLI via npx)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Google Cloud ───────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & push image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            --build-arg VITE_APP_ENV=production \
            --build-arg VITE_APP_DOMAIN=ict-cloud.solutions \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ict-cloud-portal \
            --image $IMAGE:${{ github.sha }} \
            --platform managed \
            --region europe-west2 \
            --port 8080 \
            --allow-unauthenticated \
            --quiet

      # ── Supabase Edge Functions ────────────────────────────────
      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase functions deploy chat   --project-ref $SUPABASE_PROJECT_ID
          npx supabase functions deploy embed  --project-ref $SUPABASE_PROJECT_ID
          npx supabase functions deploy ingest --project-ref $SUPABASE_PROJECT_ID
