name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ict-cloud-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & push image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            --build-arg VITE_APP_ENV=production \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ict-cloud-portal \
            --image $IMAGE:${{ github.sha }} \
            --platform managed \
            --region europe-west2 \
            --port 8080 \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase functions deploy chat   --project-ref $SUPABASE_PROJECT_ID
          npx supabase functions deploy embed  --project-ref $SUPABASE_PROJECT_ID
          npx supabase functions deploy ingest --project-ref $SUPABASE_PROJECT_ID
