server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────
    # Defined as a variable so inner location blocks can $include them
    # without nginx's header-inheritance quirk dropping them.
    # nginx does NOT inherit add_header from parent blocks when a child
    # block has its own add_header, so every location block repeats them.

    # ── SPA fallback ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options           "DENY"            always;
        add_header X-Content-Type-Options    "nosniff"         always;
        add_header Referrer-Policy           "no-referrer"     always;
        add_header Permissions-Policy        "geolocation=()"  always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.openai.com https://*.openai.azure.com; img-src 'self' data:;" always;
    }

    # ── Static assets — long-lived cache + full security headers ──
    # Headers must be re-declared here; nginx drops parent add_header
    # directives when a location block defines its own.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control             "public, immutable" always;
        add_header X-Frame-Options           "DENY"              always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header Referrer-Policy           "no-referrer"       always;
        add_header Permissions-Policy        "geolocation=()"    always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.openai.com https://*.openai.azure.com; img-src 'self' data:;" always;
    }

    # ── Health check endpoint for Cloud Run / DO App Platform ────
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
