server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header Referrer-Policy           "no-referrer"     always;
    add_header Permissions-Policy        "geolocation=()"  always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:;" always;

    # Serve static assets with long-lived caching
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — send all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run / DO App Platform
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
